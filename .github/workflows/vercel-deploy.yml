name: Build and deploy

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Vercel (optional)
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Deploy via Vercel Git integration
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "VERCEL_TOKEN secret not set — skipping CLI deploy."
          echo "Production deploy still runs via Vercel Git integration on push to main."
